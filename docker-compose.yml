services:

  postgres:
    image: postgres:16
    container_name: energy-airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5


  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    container_name: energy-airflow

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/gcp/application_default_credentials.json

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt/energy_pipeline:/opt/airflow/dbt/energy_pipeline
      - ./src:/opt/airflow/src
      - ./data/raw:/opt/airflow/data/raw:ro
      - ${APPDATA}/gcloud/application_default_credentials.json:/opt/airflow/gcp/application_default_credentials.json:ro  
      - ${USERPROFILE}/.dbt/profiles.yml:/home/airflow/.dbt/profiles.yml:ro
    ports:
      - "8080:8080"

    command: >
      bash -c "
      airflow db migrate &&
      airflow standalone
      "


volumes:
  postgres_data: